name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: ''
      SERPAPI_API_KEY: ''
      API_REDIS_REST_URL: ''
      API_REDIS_REST_TOKEN: ''
      API_SECURITY_MODE: local-test
      API_CLIENT_IDENTITY: shared
      RECIPE_SEARCH_MODE: demo
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use project npm version
        run: npm install --global npm@11.15.0
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Validate secrets, lint, types, units, API, build and complete E2E
        run: npm run ci:validate
      - name: Retain validation diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            ci-reports/summary.md
            ci-reports/results.json
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 7
